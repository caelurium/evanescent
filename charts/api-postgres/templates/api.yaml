apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: {{ required "api.image must be set" .Values.api.image | quote }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: api-password
            - name: PGRST_DB_URI
              value: postgres://authenticator:$(DB_PASSWORD)@postgres:5432/demo
            - name: PGRST_DB_SCHEMAS
              value: api
            - name: PGRST_DB_ANON_ROLE
              value: web_anon
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3000
            - name: admin
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 2
