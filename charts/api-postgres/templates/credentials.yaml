{{- $secret := lookup "v1" "Secret" .Release.Namespace "database-credentials" }}
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  annotations:
    # Keep credentials with the volume across release retries. Namespace deletion removes them.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $secret }}
  postgres-password: {{ index $secret.data "postgres-password" | quote }}
  api-password: {{ index $secret.data "api-password" | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  api-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
