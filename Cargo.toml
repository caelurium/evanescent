[package]
name = "evanescent"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A Kubernetes operator for ephemeral environments"
repository = "https://github.com/caelurium/evanescent"
readme = "README.md"
publish = false

[dependencies]
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_37"] }
kube = { version = "5.2", features = ["derive", "runtime"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde-saphyr = "2.2"
