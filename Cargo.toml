[package]
name = "evanescent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A Kubernetes operator for ephemeral environments"
repository = "https://github.com/caelurium/evanescent"
readme = "README.md"
publish = false

[dependencies]
k8s-openapi = { version = "0.29", features = ["v1_37"] }
kube = { version = "5.2", default-features = false, features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde-saphyr = "2.2"
