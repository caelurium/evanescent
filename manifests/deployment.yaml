apiVersion: apps/v1
kind: Deployment
metadata:
  name: evanescent
  namespace: evanescent-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: evanescent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evanescent
    spec:
      serviceAccountName: evanescent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evanescent
          image: evanescent:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
