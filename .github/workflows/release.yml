name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Prepare or publish release
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Report missing release credentials
        if: env.RELEASE_PLEASE_TOKEN == ''
        run: echo "::notice::Release Please skipped because RELEASE_PLEASE_TOKEN is not configured."

      - name: Update release PR or publish a merged release
        if: env.RELEASE_PLEASE_TOKEN != ''
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
